name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be silently
      # repointed by its owner (as happened to trivy-action and
      # kics-github-action). The trailing comment records which tag the SHA was.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads the code. Leaving the token in .git/config lets
          # any later step or uploaded artifact carry it (zizmor: artipacked).
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `install`) so a lockfile drift fails the run instead of
      # being silently resolved to different versions than the ones tested.
      - name: Install dependencies
        run: npm ci

      # Each check runs even if an earlier one failed, so one run reports every
      # problem rather than only the first.
      - name: Types
        run: npx tsc --noEmit

      - name: Lint and format
        if: '!cancelled()'
        run: npx biome check .

      - name: Tests
        if: '!cancelled()'
        run: npx vitest run
